# Construit le site Hugo et le publie sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Source = « GitHub Actions ».
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour relancer à la main

# Moindre privilège : lecture du code, écriture sur Pages, jeton OIDC pour
# prouver à Pages que le déploiement vient bien de ce workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1 # garder identique à la version locale (README)
      HUGO_ENVIRONMENT: production
      TZ: America/Toronto
    steps:
      # Les actions sont épinglées sur un SHA de commit (immuable) plutôt que
      # sur une étiquette (déplaçable) : protection contre la compromission
      # de la chaîne d'approvisionnement. L'étiquette est notée en commentaire.
      - name: Checkout (avec le submodule PaperMod)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo extended (somme SHA-256 vérifiée)
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" hugo
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        # base_url = https://le6009.github.io/blog tant que le domaine n'est
        # pas configuré, puis https://jesenlaplume.ca automatiquement.
        run: |
          hugo version
          hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Garde-fou — aucun [À COMPLÉTER] dans un article publié
        run: |
          if grep -rl "À COMPLÉTER" public/posts public/fr/posts 2>/dev/null; then
            echo "::error::Un article publié contient encore [À COMPLÉTER] (voir fichiers ci-dessus)."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
